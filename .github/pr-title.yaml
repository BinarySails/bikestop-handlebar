name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

env:
  RUST_VERSION: "1.96"

jobs:
  lint:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install commitlint-rs
        run: cargo binstall commitlint-rs --no-confirm

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | commitlint -e /dev/stdin
